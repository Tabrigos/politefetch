[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "politefetch"
dynamic = ["version"]
description = "A polite, crash-safe gate between an ingest service and the external sources it polls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.entry-points.pytest11]
politefetch = "politefetch.testing.plugin"

# The bundled agent skill, found by `python -m <package>.skill sync` of any
# package that follows the same scheme (see politefetch/skill/__init__.py).
[project.entry-points.agent_skills]
politefetch = "politefetch.skill"

[project.optional-dependencies]
# The core never imports them. httpx stays below 1.0 until 1.0 is released.
httpx = ["httpx>=0.28,<1"]
requests = ["requests>=2.32,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-requests>=2.32",
]

[tool.hatch.version]
path = "src/politefetch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/politefetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "pytester"]
politefetch_barrier = true
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
warn_unreachable = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# Ruff also formats code blocks in Markdown; the docs are written by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET",
    "DTZ",  # no naive datetimes
    "TID",  # banned APIs below
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Read time from an injected politefetch.clock.Clock."
"time.time_ns".msg = "Read time from an injected politefetch.clock.Clock."
"datetime.datetime.now".msg = "Read time from an injected politefetch.clock.Clock."
"datetime.datetime.utcnow".msg = "Read time from an injected politefetch.clock.Clock."
"datetime.datetime.today".msg = "Read time from an injected politefetch.clock.Clock."
"datetime.date.today".msg = "Read time from an injected politefetch.clock.Clock."
