name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: politefetch
          POSTGRES_PASSWORD: politefetch
          POSTGRES_DB: politefetch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U politefetch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A throwaway password for a database that lives as long as the job.
      POLITEFETCH_TEST_POSTGRES: host=127.0.0.1 port=5432 dbname=politefetch_test user=politefetch password=politefetch
      POLITEFETCH_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: uv sync --all-extras
        run: uv sync --all-extras --locked
      - name: pytest
        run: uv run pytest
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  windows:
    # The pytest plugin loads in every project that installs politefetch, so
    # it must work on Windows too. No Postgres here (Windows runners have no
    # service containers): those tests run in `checks`. mypy runs again
    # because it type-checks the win32 branches only on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: uv sync --all-extras
        run: uv sync --all-extras --locked
      - name: pytest
        run: uv run pytest
      - name: mypy
        run: uv run mypy
